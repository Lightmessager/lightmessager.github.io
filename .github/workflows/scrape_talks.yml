name: Scrape Talk Locations

on:
  push:
    paths:
      - 'talks/**'
      - '_talks/**'
      - 'talkmap.ipynb'
      - '.github/workflows/scrape_talks.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # This workflow pushes to the repository

    steps:
    - uses: actions/checkout@v2

    - name: Check for talk records
      id: talks
      shell: bash
      run: |
        if compgen -G '_talks/*.md' > /dev/null; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "No talk records; skipping map generation."
        fi

    - name: Set up Python
      if: steps.talks.outputs.present == 'true'
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'   # Specify the Python version you need

    - name: Install dependencies
      if: steps.talks.outputs.present == 'true'
      run: |
        pip install jupyter pandas requests beautifulsoup4 geopy  # Add other dependencies as needed
        pip install getorg --upgrade

    - name: Run Jupyter Notebook
      if: steps.talks.outputs.present == 'true'
      run: |
        jupyter nbconvert --to notebook --execute talkmap.ipynb --output talkmap_out.ipynb

    - name: Commit changes
      if: steps.talks.outputs.present == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Automated update of talk locations" || echo "No changes to commit"
        git push
